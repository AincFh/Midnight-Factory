name: Midnight Factory · Test and Publish
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: factory-pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate standalone HTML game
        run: |
          test -s index.html
          test -s midnight-factory.html
          python - <<'PY'
          from pathlib import Path
          data=Path("midnight-factory.html").read_text()
          assert len(data)>300_000 and '<canvas id="game-canvas">' in data
          assert 'new Worker(' in data and 'DOMContentLoaded' in data
          print("Factory simulation engine and rendering shell verified")
          PY
      - name: Install Chrome test requirements
        run: python -m pip install selenium==4.37.0
      - name: Chromium real interaction and mobile screenshots
        run: python tests/browser_smoke.py
      - name: Preserve screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-browser-proof
          path: test-results/
          if-no-files-found: ignore
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "\u0024{{ steps.deployment.outputs.page_url }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
