name: ATLAS · Validate & Publish Midnight Factory
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: midnight-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/delivery.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install selenium==4.37.0
      - name: Verify real browser gameplay and mobile layout
        run: python tests/browser_smoke.py
      - name: Attach real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midnight-factory-playtest
          path: test-results/
          if-no-files-found: ignore
      - run: test -s index.html && test -s midnight-factory.html && test -s LICENSE
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: .
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
